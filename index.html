<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almasry United - كتالوج المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #c2185b;
            --accent-color: #ec407a;
            --soft-pink: #fce4ec;
            --whatsapp-color: #25D366;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #4a2335;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 100px;
        }

        /* الهيدر */
        header {
            background: linear-gradient(135deg, #ad1457, #ec407a);
            color: white;
            padding: 28px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.25);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.92;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        /* شريط البحث */
        .search-box {
            margin: 18px 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1.5px solid #f8bbd0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            background: white;
            color: var(--text-color);
            box-shadow: 0 3px 10px rgba(236, 64, 122, 0.06);
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
        }

        /* الأقسام */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: white;
            border: 1.5px solid #f8bbd0;
            padding: 9px 22px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.25s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(194, 24, 91, 0.07);
            border: 1px solid #fce4ec;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(194, 24, 91, 0.14);
        }

        .product-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            background-color: var(--soft-pink);
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            text-align: center;
        }

        .product-cat-tag {
            font-size: 0.75rem;
            color: #ad1457;
            background: var(--soft-pink);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto 6px auto;
            font-weight: 600;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .select-qty-hint {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        /* شريط السلة السفلي */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 18px rgba(194, 24, 91, 0.12);
            border-top: 1px solid #f8bbd0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-summary {
            display: flex;
            flex-direction: column;
        }

        .cart-count-text {
            font-size: 0.85rem;
            color: #880e4f;
        }

        .cart-total-text {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--primary-color);
        }

        .view-cart-btn {
            background: linear-gradient(135deg, #ec407a, #ad1457);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
        }

        /* زر دخول الإدارة في الفوتر */
        .admin-footer-link {
            text-align: center;
            margin-top: 35px;
            padding: 10px;
        }

        .admin-trigger-btn {
            background: none;
            border: 1px dashed #f48fb1;
            color: #ad1457;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .admin-trigger-btn:hover {
            opacity: 1;
            background: var(--soft-pink);
        }

        /* النوافذ المنبثقة (Modals) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(74, 35, 53, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 580px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fce4ec;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .close-modal {
            background: var(--soft-pink);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نافذة تحديد الكمية */
        .product-modal-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .product-modal-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid #f8bbd0;
            margin-bottom: 12px;
        }

        .product-modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-modal-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 18px;
        }

        .qty-selector-box {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-color);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1.5px solid #f8bbd0;
            margin-bottom: 20px;
        }

        .qty-big-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-big-value {
            font-size: 1.4rem;
            font-weight: 700;
            min-width: 35px;
            text-align: center;
        }

        .confirm-add-btn {
            background: linear-gradient(135deg, #ec407a, #ad1457);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* عناصر السلة */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #fce4ec;
        }

        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-weight: 700; font-size: 0.95rem; }
        .cart-item-price { color: var(--accent-color); font-size: 0.85rem; font-weight: 600; }

        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            background: var(--soft-pink);
            color: var(--primary-color);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .form-group input, .form-group select {
            padding: 11px 14px;
            border: 1.5px solid #f8bbd0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: white;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: -5px;
        }

        .whatsapp-order-btn {
            background: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* لوحة تحكم الأدمن */
        .admin-prod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #f8bbd0;
        }

        .delete-prod-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .export-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-msg { text-align: center; color: #ad1457; padding: 25px 0; }
    </style>
</head>
<body>

    <header>
        <h1>Almasry United</h1>
        <p>عالم الجمال والميكاب ومستحضرات العناية والعدسات</p>
    </header>

    <div class="container">
        <!-- شريط البحث -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ابحثي عن منتجك المفضل...">
            <i class="fa-solid fa-search"></i>
        </div>

        <!-- الأقسام -->
        <div class="categories">
            <button class="cat-btn active" data-category="all">الكل</button>
            <button class="cat-btn" data-category="مستحضرات تجميل">مستحضرات تجميل</button>
            <button class="cat-btn" data-category="ميكاب">ميكاب</button>
            <button class="cat-btn" data-category="أدوات">أدوات</button>
            <button class="cat-btn" data-category="عدسات">عدسات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="products-container"></div>

        <!-- زر دخول الإدارة -->
        <div class="admin-footer-link">
            <button class="admin-trigger-btn" id="open-admin-login">
                <i class="fa-solid fa-lock"></i> دخول الإدارة
            </button>
        </div>
    </div>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar">
        <div class="cart-summary">
            <span class="cart-count-text">القطع المختارة: <strong id="cart-count">0</strong></span>
            <span class="cart-total-text">الإجمالي: <span id="cart-total">0</span> ج.م</span>
        </div>
        <button class="view-cart-btn" id="open-cart-btn">
            <i class="fa-solid fa-bag-shopping"></i> السلة
        </button>
    </div>

    <!-- نافذة تحديد الكمية -->
    <div class="modal" id="qty-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>تحديد الكمية</h3>
                <button class="close-modal" id="close-qty-btn">&times;</button>
            </div>
            <div class="product-modal-body">
                <img src="" alt="" id="modal-prod-img" class="product-modal-img">
                <div id="modal-prod-title" class="product-modal-title"></div>
                <div id="modal-prod-price" class="product-modal-price"></div>
                
                <div class="qty-selector-box">
                    <button class="qty-big-btn" id="decrease-modal-qty">-</button>
                    <span class="qty-big-value" id="modal-qty-value">1</span>
                    <button class="qty-big-btn" id="increase-modal-qty">+</button>
                </div>

                <button class="confirm-add-btn" id="confirm-add-to-cart">
                    <i class="fa-solid fa-cart-plus"></i> إضافة للسلة (<span id="modal-subtotal">0</span> ج.م)
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>سلة المشتريات</h3>
                <button class="close-modal" id="close-cart-btn">&times;</button>
            </div>

            <div id="cart-items-container"></div>

            <div id="checkout-section" style="display: none;">
                <div style="margin-top: 15px; font-weight: 700; font-size: 1.15rem; text-align: left; color: var(--primary-color);">
                    الإجمالي النهائي: <span id="modal-total" style="color: var(--accent-color);">0</span> ج.م
                </div>

                <div class="form-group">
                    <input type="text" id="customer-name" placeholder="الاسم بالكامل (اختياري)">
                    <input type="text" id="customer-address" placeholder="العنوان بالتفصيل (اختياري)">
                </div>

                <button class="whatsapp-order-btn" id="send-whatsapp-btn">
                    <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> إرسال الطلب عبر واتساب
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة لوحة تحكم الأدمن -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-shield-halved"></i> لوحة تحكم الإدارة</h3>
                <button class="close-modal" id="close-admin-btn">&times;</button>
            </div>

            <div id="admin-login-form" style="display: none;">
                <div class="form-group" style="margin-top: 0;">
                    <input type="email" id="admin-email" placeholder="إيميل الإدارة" style="direction: ltr; text-align: right;">
                    <input type="password" id="admin-pass" placeholder="كلمة المرور" style="direction: ltr; text-align: right;">
                    <p id="admin-login-error" style="color: #c2185b; font-size: 0.85rem; text-align: center; min-height: 1.2em;"></p>
                    <button class="confirm-add-btn" id="admin-login-btn">
                        <i class="fa-solid fa-right-to-bracket"></i> دخول
                    </button>
                </div>
            </div>

            <div id="admin-panel-content" style="display: none;">
            <div style="background: var(--bg-color); padding: 15px; border-radius: 14px; border: 1px solid #f8bbd0; margin-bottom: 20px;">
                <h4 style="margin-bottom: 10px; color: var(--primary-color);">+ إضافة منتج جديد</h4>
                <div class="form-group" style="margin-top: 0;">
                    <input type="text" id="new-prod-name" placeholder="اسم المنتج">
                    <select id="new-prod-cat">
                        <option value="مستحضرات تجميل">مستحضرات تجميل</option>
                        <option value="ميكاب">ميكاب</option>
                        <option value="أدوات">أدوات</option>
                        <option value="عدسات">عدسات</option>
                    </select>
                    <input type="number" id="new-prod-price" placeholder="السعر (بالجنيه)">
                    
                    <label for="new-prod-img-file"><i class="fa-solid fa-image"></i> اختر صورة المنتج من الموبايل:</label>
                    <input type="file" id="new-prod-img-file" accept="image/*">
                    
                    <button class="confirm-add-btn" id="add-new-prod-btn">
                        <i class="fa-solid fa-plus"></i> حفظ المنتج في الكتالوج
                    </button>
                </div>
            </div>

            <h4 style="margin-bottom: 10px; color: var(--primary-color);">المنتجات الحالية (<span id="admin-prod-count">0</span>)</h4>
            <div id="admin-products-list" style="max-height: 220px; overflow-y: auto;"></div>

            <p style="font-size: 0.78rem; color: #7f8c8d; margin-top: 6px; text-align: center;">
                التعديلات بتتحفظ أونلاين وبتظهر لكل الزباين على طول، من أي جهاز.
            </p>
            <button class="export-btn" id="admin-logout-btn" style="background: #fff; color: var(--primary-color); border: 1.5px solid #f8bbd0;">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
            </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

        // المنتجات بتتخزن أونلاين في Firestore وبتتحدث لحظياً لكل الزباين
        let products = defaultProducts.slice(); // عرض مبدئي لحد ما القاعدة تحمل

        db.collection("products").orderBy("id").onSnapshot(snapshot => {
            products = snapshot.docs.map(d => ({ ...d.data(), docId: d.id }));
            renderProducts();
            renderAdminList();
        }, err => {
            console.error("Firestore error:", err);
        });

        let cart = [];
        let currentCategory = "all";
        let selectedProduct = null;
        let selectedQty = 1;

        const productsContainer = document.getElementById("products-container");
        const searchInput = document.getElementById("search-input");
        const catButtons = document.querySelectorAll(".cat-btn");

        function renderProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            productsContainer.innerHTML = "";

            const filtered = products.filter(p => {
                const matchCat = currentCategory === "all" || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                productsContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ad1457; padding: 30px;">لا توجد منتجات مطابقة لبحثك.</p>`;
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.onclick = () => openQtyModal(product.id);
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Almasry+United'">
                    <div class="product-info">
                        <div>
                            <div class="product-cat-tag">${product.category}</div>
                            <div class="product-title">${product.name}</div>
                            <div class="product-price">${product.price} ج.م</div>
                        </div>
                        <button class="select-qty-hint">
                            <i class="fa-solid fa-plus-circle"></i> اختاري الكمية
                        </button>
                    </div>
                `;
                productsContainer.appendChild(card);
            });
        }

        const qtyModal = document.getElementById("qty-modal");
        function openQtyModal(productId) {
            selectedProduct = products.find(p => p.id === productId);
            if (!selectedProduct) return;

            selectedQty = 1;
            document.getElementById("modal-prod-img").src = selectedProduct.image;
            document.getElementById("modal-prod-title").textContent = selectedProduct.name;
            document.getElementById("modal-prod-price").textContent = `${selectedProduct.price} ج.م للقطعة`;
            updateQtyModalDisplay();

            qtyModal.classList.add("open");
        }

        function updateQtyModalDisplay() {
            document.getElementById("modal-qty-value").textContent = selectedQty;
            document.getElementById("modal-subtotal").textContent = selectedProduct.price * selectedQty;
        }

        document.getElementById("decrease-modal-qty").addEventListener("click", () => {
            if (selectedQty > 1) { selectedQty--; updateQtyModalDisplay(); }
        });

        document.getElementById("increase-modal-qty").addEventListener("click", () => {
            selectedQty++; updateQtyModalDisplay();
        });

        document.getElementById("confirm-add-to-cart").addEventListener("click", () => {
            if (!selectedProduct) return;
            const existing = cart.find(item => item.id === selectedProduct.id);
            if (existing) { existing.qty += selectedQty; } 
            else { cart.push({ ...selectedProduct, qty: selectedQty }); }
            updateCartUI();
            qtyModal.classList.remove("open");
        });

        document.getElementById("close-qty-btn").addEventListener("click", () => qtyModal.classList.remove("open"));
        qtyModal.addEventListener("click", (e) => { if (e.target === qtyModal) qtyModal.classList.remove("open"); });

        function changeQty(productId, delta) {
            const itemIndex = cart.findIndex(item => item.id === productId);
            if (itemIndex > -1) {
                cart[itemIndex].qty += delta;
                if (cart[itemIndex].qty <= 0) cart.splice(itemIndex, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById("cart-count").textContent = totalCount;
            document.getElementById("cart-total").textContent = totalPrice;
            document.getElementById("modal-total").textContent = totalPrice;

            const cartItemsContainer = document.getElementById("cart-items-container");
            const checkoutSection = document.getElementById("checkout-section");

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="empty-msg">السلة فارغة حالياً، اضغطي على أي منتج لاختيار الكمية.</p>`;
                checkoutSection.style.display = "none";
            } else {
                checkoutSection.style.display = "block";
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price} ج.م × ${item.qty} = ${item.price * item.qty} ج.م</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join("");
            }
        }

        catButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                catButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentCategory = btn.getAttribute("data-category");
                renderProducts();
            });
        });

        searchInput.addEventListener("input", renderProducts);

        const cartModal = document.getElementById("cart-modal");
        document.getElementById("open-cart-btn").addEventListener("click", () => cartModal.classList.add("open"));
        document.getElementById("close-cart-btn").addEventListener("click", () => cartModal.classList.remove("open"));
        cartModal.addEventListener("click", (e) => { if (e.target === cartModal) cartModal.classList.remove("open"); });

        document.getElementById("send-whatsapp-btn").addEventListener("click", () => {
            if (cart.length === 0) return;
            const name = document.getElementById("customer-name").value.trim();
            const address = document.getElementById("customer-address").value.trim();
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            let message = `*طلب جديد من كتالوج Almasry United* 🌸🛍️\n\n`;
            cart.forEach((item, index) => {
                message += `${index + 1}. *${item.name}*\n   الكمية: ${item.qty} | السعر: ${item.price * item.qty} ج.م\n`;
            });
            message += `\n*الإجمالي المطلوب: ${totalPrice} ج.م*\n`;
            if (name) message += `👤 الاسم: ${name}\n`;
            if (address) message += `📍 العنوان: ${address}\n`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, "_blank");
        });

        const adminModal = document.getElementById("admin-modal");

        function showAdminPanel() {
            document.getElementById("admin-login-form").style.display = "none";
            document.getElementById("admin-panel-content").style.display = "block";
            renderAdminList();
        }

        document.getElementById("open-admin-login").addEventListener("click", () => {
            if (auth.currentUser) { showAdminPanel(); }
            else {
                document.getElementById("admin-login-form").style.display = "block";
                document.getElementById("admin-panel-content").style.display = "none";
            }
            adminModal.classList.add("open");
        });

        document.getElementById("admin-login-btn").addEventListener("click", () => {
            const email = document.getElementById("admin-email").value.trim();
            const pass = document.getElementById("admin-pass").value;
            const errEl = document.getElementById("admin-login-error");
            errEl.textContent = "";
            if (!email || !pass) { errEl.textContent = "اكتب الإيميل وكلمة المرور"; return; }
            const btn = document.getElementById("admin-login-btn");
            btn.disabled = true;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    btn.disabled = false;
                    document.getElementById("admin-pass").value = "";
                    showAdminPanel();
                    migrateIfEmpty();
                })
                .catch(() => {
                    btn.disabled = false;
                    errEl.textContent = "بيانات الدخول غير صحيحة!";
                });
        });

        document.getElementById("admin-logout-btn").addEventListener("click", () => {
            auth.signOut().then(() => {
                adminModal.classList.remove("open");
            });
        });

        // أول مرة بعد التحديث: لو القاعدة فاضية، انقل المنتجات الحالية ليها تلقائياً
        function migrateIfEmpty() {
            db.collection("products").limit(1).get().then(snap => {
                if (!snap.empty) return;
                const batch = db.batch();
                defaultProducts.forEach(p => {
                    batch.set(db.collection("products").doc(), p);
                });
                batch.commit().then(() => alert("تم نقل منتجاتك الحالية أونلاين بنجاح! 🎉"));
            });
        }

        document.getElementById("close-admin-btn").addEventListener("click", () => adminModal.classList.remove("open"));
        adminModal.addEventListener("click", (e) => { if (e.target === adminModal) adminModal.classList.remove("open"); });

        function renderAdminList() {
            document.getElementById("admin-prod-count").textContent = products.length;
            const listContainer = document.getElementById("admin-products-list");
            listContainer.innerHTML = products.map((p, index) => `
                <div class="admin-prod-item">
                    <div>
                        <strong>${p.name}</strong>
                        <div style="font-size: 0.8rem; color: #7f8c8d;">${p.category} - ${p.price} ج.م</div>
                    </div>
                    <button class="delete-prod-btn" onclick="deleteProduct(${index})">حذف</button>
                </div>
            `).join("");
        }

        window.deleteProduct = function(index) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                const p = products[index];
                if (!p || !p.docId) return;
                db.collection("products").doc(p.docId).delete()
                    .catch(() => alert("حصل خطأ أثناء الحذف، حاول تاني"));
            }
        };

        // دالة ضغط وتصغير الصورة تلقائياً لتوفر مساحة التخزين وتمنع بطء الموقع
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 400; 
                    const scale = maxWidth / img.width;
                    canvas.width = scale < 1 ? maxWidth : img.width;
                    canvas.height = scale < 1 ? img.height * scale : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    callback(compressedDataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // زر إضافة منتج جديد مع التحقق الكامل من البيانات والحفظ الفوري
        document.getElementById("add-new-prod-btn").addEventListener("click", () => {
            const nameInput = document.getElementById("new-prod-name");
            const priceInput = document.getElementById("new-prod-price");
            const categorySelect = document.getElementById("new-prod-cat");
            const fileInput = document.getElementById("new-prod-img-file");

            const name = nameInput.value.trim();
            const category = categorySelect.value;
            const price = parseFloat(priceInput.value);

            if (!name) {
                alert("من فضلك أدخل اسم المنتج!");
                nameInput.focus();
                return;
            }

            if (isNaN(price) || price <= 0) {
                alert("من فضلك أدخل سعراً صحيحاً للمنتج!");
                priceInput.focus();
                return;
            }

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], function(compressedImage) {
                    saveNewProduct(name, category, price, compressedImage);
                });
            } else {
                saveNewProduct(name, category, price, "https://via.placeholder.com/300?text=Almasry+United");
            }
        });

        function saveNewProduct(name, category, price, image) {
            const newProduct = {
                id: Date.now(),
                name: name,
                category: category,
                price: price,
                image: image
            };

            db.collection("products").add(newProduct)
                .then(() => {
                    document.getElementById("new-prod-name").value = "";
                    document.getElementById("new-prod-price").value = "";
                    document.getElementById("new-prod-img-file").value = "";
                    alert("تم حفظ المنتج بنجاح وظهر في الكتالوج فوراً لكل الزباين! 🎉");
                })
                .catch(() => alert("حصل خطأ أثناء الحفظ، حاول تاني"));
        }


        // تشغيل عرض المنتجات عند تحميل الصفحة
        renderProducts();
    </script>
</body>
</html>
