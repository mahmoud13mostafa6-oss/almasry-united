<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almasry United - كتالوج المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #c2185b;
            --accent-color: #ec407a;
            --soft-pink: #fce4ec;
            --whatsapp-color: #25D366;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #4a2335;
            --border-radius: 16px;
        }

        /* تم تصحيح العلامة هنا من - إلى * */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 100px;
        }

        /* الهيدر */
        header {
            background: linear-gradient(135deg, #ad1457, #ec407a);
            color: white;
            padding: 28px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(236, 64, 122, 0.25);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.92;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        /* شريط البحث */
        .search-box {
            margin: 18px 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border: 1.5px solid #f8bbd0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            background: white;
            color: var(--text-color);
            box-shadow: 0 3px 10px rgba(236, 64, 122, 0.06);
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
        }

        /* الأقسام */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: white;
            border: 1.5px solid #f8bbd0;
            padding: 9px 22px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.25s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(194, 24, 91, 0.07);
            border: 1px solid #fce4ec;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(194, 24, 91, 0.14);
        }

        .product-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            background-color: var(--soft-pink);
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            text-align: center;
        }

        .product-cat-tag {
            font-size: 0.75rem;
            color: #ad1457;
            background: var(--soft-pink);
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto 6px auto;
            font-weight: 600;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .select-qty-hint {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        /* شريط السلة السفلي */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -4px 18px rgba(194, 24, 91, 0.12);
            border-top: 1px solid #f8bbd0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-summary {
            display: flex;
            flex-direction: column;
        }

        .cart-count-text {
            font-size: 0.85rem;
            color: #880e4f;
        }

        .cart-total-text {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--primary-color);
        }

        .view-cart-btn {
            background: linear-gradient(135deg, #ec407a, #ad1457);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
        }

        /* زر دخول الإدارة في الفوتر */
        .admin-footer-link {
            text-align: center;
            margin-top: 35px;
            padding: 10px;
        }

        .admin-trigger-btn {
            background: none;
            border: 1px dashed #f48fb1;
            color: #ad1457;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .admin-trigger-btn:hover {
            opacity: 1;
            background: var(--soft-pink);
        }

        /* النوافذ المنبثقة (Modals) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(74, 35, 53, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 580px;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fce4ec;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .close-modal {
            background: var(--soft-pink);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نافذة تحديد الكمية */
        .product-modal-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .product-modal-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid #f8bbd0;
            margin-bottom: 12px;
        }

        .product-modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-modal-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 18px;
        }

        .qty-selector-box {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-color);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1.5px solid #f8bbd0;
            margin-bottom: 20px;
        }

        .qty-big-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-big-value {
            font-size: 1.4rem;
            font-weight: 700;
            min-width: 35px;
            text-align: center;
        }

        .confirm-add-btn {
            background: linear-gradient(135deg, #ec407a, #ad1457);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* عناصر السلة */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #fce4ec;
        }

        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-weight: 700; font-size: 0.95rem; }
        .cart-item-price { color: var(--accent-color); font-size: 0.85rem; font-weight: 600; }

        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            background: var(--soft-pink);
            color: var(--primary-color);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .form-group input, .form-group select {
            padding: 11px 14px;
            border: 1.5px solid #f8bbd0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: white;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: -5px;
        }

        .whatsapp-order-btn {
            background: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* لوحة تحكم الأدمن */
        .admin-prod-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-color);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #f8bbd0;
        }

        .delete-prod-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .export-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .empty-msg { text-align: center; color: #ad1457; padding: 25px 0; }
    </style>
</head>
<body>

    <header>
        <h1>Almasry United</h1>
        <p>عالم الجمال والميكاب ومستحضرات العناية والعدسات</p>
    </header>

    <div class="container">
        <!-- شريط البحث -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ابحثي عن منتجك المفضل...">
            <i class="fa-solid fa-search"></i>
        </div>

        <!-- الأقسام -->
        <div class="categories">
            <button class="cat-btn active" data-category="all">الكل</button>
            <button class="cat-btn" data-category="مستحضرات تجميل">مستحضرات تجميل</button>
            <button class="cat-btn" data-category="ميكاب">ميكاب</button>
            <button class="cat-btn" data-category="أدوات">أدوات</button>
            <button class="cat-btn" data-category="عدسات">عدسات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="products-container"></div>

        <!-- زر دخول الإدارة -->
        <div class="admin-footer-link">
            <button class="admin-trigger-btn" id="open-admin-login">
                <i class="fa-solid fa-lock"></i> دخول الإدارة
            </button>
        </div>
    </div>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar">
        <div class="cart-summary">
            <span class="cart-count-text">القطع المختارة: <strong id="cart-count">0</strong></span>
            <span class="cart-total-text">الإجمالي: <span id="cart-total">0</span> ج.م</span>
        </div>
        <button class="view-cart-btn" id="open-cart-btn">
            <i class="fa-solid fa-bag-shopping"></i>
